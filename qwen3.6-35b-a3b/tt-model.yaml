#
# tt-model (v5.1 container) manifest: Qwen3.6-35B-A3B on one Tenstorrent P150, single-sequence runtime.
# Release: https://huggingface.co/Lottolabs/Qwen3.6-35B-A3B-TT-Mixed-BFP4-BFP8-P150 (release x6-fused-20261007,
# commit c355c41d, runtime image lottolabs/qwen36-35b-tt-p150:single-x6).  The release's batched mode runs a different
# runtime tree (image batched-x6) and is packaged separately: ../qwen3.6-35b-a3b-batched/tt-model.yaml.
# Build from this directory:
#   ../scripts/build_vllm_wheel.sh lottolabs/qwen3.6-35b-a3b-p150 wheels
#   tt-model package --container tt-model.yaml --out build
#   tt-model push build/qwen3.6-35b-a3b-tt-p150
# Profiles mirror the release launcher's single mode (launch.py --mode single, with and without --no-mtp).
schema: "5.1"

repo: Lottolabs/Qwen3.6-35B-A3B-TT-Mixed-BFP4-BFP8-P150-tt-model
name: qwen3.6-35b-a3b-tt-p150

# The release repo at its pinned commit.  checkpoint/ is the TT-native checkpoint (BFP4 GPTQ experts, BFP8 dense,
# BF16 rest, MTP head; 21.7 GB) with the upstream config / tokenizer / chat template.  runtime-image.tar.gz,
# runtime/, evidence/ and tools/ are not fetched.
weights:
  repo: Lottolabs/Qwen3.6-35B-A3B-TT-Mixed-BFP4-BFP8-P150
  revision: c355c41d4fd079c6df3c4ba9bab1c40f37c17f09
  allow_patterns:
    - "checkpoint/*"

kind: vllm-plugin
arch: blackhole

image:
  registry: hf

source:
  # public tenstorrent/tt-metal de59f8a (v0.76.0 + 1) + the Qwen3.6 runtime of the release's single image: the qwen36
  # model package, MoE modules and kernels, gated deltanet overlays, tt_transformers generator, and host C++ for
  # ttnn matmul / sparse_matmul / chunk_gated_delta_rule / gated_delta_attn (built from this tree).
  tt_metal:
    repo: https://github.com/LottoLottoLotto/tt-metal
    ref: lottolabs/qwen3.6-35b-a3b-p150
  code:
    - models/demos/blackhole/qwen36                            # runtime, vLLM adapter, JIT kernels
    - models/common                                            # moe modules + kernels, rmsnorm, sampling, warmup
    - models/tt_transformers                                   # generator / model args the runtime builds on
    - models/experimental/gated_attention_gated_deltanet       # GDN / gated attention ops + kernels
    - models/demos/deepseek_v3_b1/unified_kernel_descriptor.py # UnifiedKernelDescriptor (python)
    - models/demos/deepseek_v3_b1/unified_kernels              # kernel_op_api.hpp & co (#included)
    - models/demos/deepseek_v3_b1/kernel_includes              # compute_kernel_api/*.h (#included)
    - models/demos/qwen3_vl/tt/common.py                       # helpers imported by the qwen36 package
    - models/tt_dit/utils/tensor.py                            # helper imported by tt_transformers
  ubuntu: "22.04"
  python: "3.10"            # the validated interpreter (the release image's python_env is 3.10.12)

runtime:
  # tenstorrent/vllm 03fa3af + the Qwen3.6 core overlays + requirements pinned to the validated set (incl. torchvision)
  # (LottoLottoLotto/vllm lottolabs/qwen3.6-35b-a3b-p150), built by ../scripts/build_vllm_wheel.sh.
  vllm: {wheel: wheels/vllm-*.whl}
  plugin:
    repo: https://github.com/LottoLottoLotto/tt-model-plugins
    ref: lottolabs/qwen3.6-35b-a3b-p150

serve:
  hardware: p150
  mesh_device: P150
  block_size: 64
  capabilities:
    tool_parser: qwen3_coder
    reasoning_parser: qwen3
  additional_config:
    tt:
      trace_mode: all
      enable_model_warmup: true
      trace_region_size: 1073741824
      l1_small_size: 24576
  env:
    # Paths into the mounted HF cache (/hf = HF_HOME).  Pinning them also makes `tt-model serve` refuse to boot over
    # an incomplete cache (the runtime opens these directly).
    HF_MODEL: /hf/hub/models--Lottolabs--Qwen3.6-35B-A3B-TT-Mixed-BFP4-BFP8-P150/snapshots/c355c41d4fd079c6df3c4ba9bab1c40f37c17f09/checkpoint
    MODEL_WEIGHTS_DIR: /hf/hub/models--Lottolabs--Qwen3.6-35B-A3B-TT-Mixed-BFP4-BFP8-P150/snapshots/c355c41d4fd079c6df3c4ba9bab1c40f37c17f09/checkpoint
    TT_CACHE_PATH: /tensor-cache         # converted-weight cache (tt-model mounts ~/.cache/tt-model/<name>/tensors here)
    HF_HUB_OFFLINE: "1"                  # serve has put the pinned snapshot on the host already
    TRANSFORMERS_OFFLINE: "1"
    VLLM_TARGET_DEVICE: tt
    TORCHDYNAMO_DISABLE: "1"
    # The release image's environment (runtime build switches; all part of the validated configuration)
    QWEN36_OPTIMIZED_27B: "0"
    QWEN36_GENERIC_BASELINE: "0"
    QWEN36_MTP_DRAFT_VOCAB: "98304"
    QWEN36_BFP4_WEIGHTS: "0"
    QWEN36_SINGLE_1D_DECODE: "1"
    QWEN36_FUSED_QKV: "1"
    QWEN36_SHARDED_FINAL_NORM: "1"
    QWEN36_FUSED_FINAL_RESIDUAL_NORM: "1"
    QWEN_SDPA_BF8: "1"
    QWEN_GDN_RECURRENT_FUSED: "1"
    QWEN_GDN_FRONTEND_FUSED: "1"
    QWEN_GDN_OUTPUT_FUSED: "1"
    # The release launcher's per-run settings
    QWEN36_DFLASH: "0"
    QWEN36_MTP_DEPTH: "1"
    QWEN36_MAX_TOKENS_ALL_USERS: "262144"
    QWEN36_PREFIX_SNAPSHOTS: "8"
  # One FLAT list (anchored): each profile's `args: [*common_args, ...]` nests it one level, which tt-model flattens.
  # vLLM is handed the repo id (positional, from `weights`); the loadable HF folder is checkpoint/ inside it.
  args: &common_args
    - --served-model-name
    - Qwen/Qwen3.6-35B-A3B
    - --hf-config-path
    - /hf/hub/models--Lottolabs--Qwen3.6-35B-A3B-TT-Mixed-BFP4-BFP8-P150/snapshots/c355c41d4fd079c6df3c4ba9bab1c40f37c17f09/checkpoint
    - --tokenizer
    - /hf/hub/models--Lottolabs--Qwen3.6-35B-A3B-TT-Mixed-BFP4-BFP8-P150/snapshots/c355c41d4fd079c6df3c4ba9bab1c40f37c17f09/checkpoint
    - --generation-config
    - /hf/hub/models--Lottolabs--Qwen3.6-35B-A3B-TT-Mixed-BFP4-BFP8-P150/snapshots/c355c41d4fd079c6df3c4ba9bab1c40f37c17f09/checkpoint
    - --seed
    - "9472"
    - --limit-mm-per-prompt
    - '{"image":0,"video":0}'
    - --max-num-batched-tokens
    - "262144"
    - --enable-prefix-caching
    - --no-enable-chunked-prefill

serve_profiles:
  - name: single
    description: >-
      The release launcher's default: one sequence, MTP-1 speculative decoding (greedy and sampled, lossless),
      native 262,144-token context, exact prefix caching.
    max_model_len: 262144
    max_num_seqs: 1
    env:
      QWEN36_MTP: "1"
    # The release passes the checkpoint folder as --model, which MTP reuses as its draft model; here --model is the
    # repo id (snapshot root, no config.json), so the draft model is named explicitly (the same folder).
    args: [*common_args, [--speculative-config, '{"method":"mtp","num_speculative_tokens":1,"model":"/hf/hub/models--Lottolabs--Qwen3.6-35B-A3B-TT-Mixed-BFP4-BFP8-P150/snapshots/c355c41d4fd079c6df3c4ba9bab1c40f37c17f09/checkpoint"}']]
  - name: single-no-mtp
    description: >-
      One sequence without speculation (launch.py --no-mtp), 262,144-token context, exact prefix caching; accepts
      min_p, logit_bias and min_tokens > 1, which MTP-1 rejects.
    max_model_len: 262144
    max_num_seqs: 1
    env:
      QWEN36_MTP: "0"
    args: [*common_args]
default_profile: single

verify:
  - "from models.demos.blackhole.qwen36.tt.qwen36_vllm import Qwen36ForCausalLM"
  - "import models.demos.blackhole.qwen36.tt.model, models.demos.blackhole.qwen36.tt.mtp, models.demos.blackhole.qwen36.tt.speculative, models.demos.blackhole.qwen36.tt.device_sampling, models.demos.blackhole.qwen36.tt.native_moe_checkpoint"
  - "import torchvision; assert torchvision.__version__.split('+')[0] == '0.26.0', torchvision.__version__"
  - "import ttnn; assert hasattr(ttnn.transformer, 'verify_two_gated_delta_rule'), 'ttnn lacks the Qwen3.6 GDN ops (C++ not built from the branch)'"
  - "import vllm_tt_plugin.prefix_resume, importlib.util as u; assert u.find_spec('vllm_tt_plugin.toks_tokenizer') is None"
  - "import inspect, vllm_tt_plugin.platform as p; assert 'TTQwen3_5MoeForConditionalGeneration' in inspect.getsource(p)"
  - "import inspect, vllm.config.speculative as s; assert 'dflash' in inspect.getsource(s)"
  - "from pathlib import Path; assert Path('/opt/tt-metal/models/demos/deepseek_v3_b1/unified_kernels/kernel_op_api.hpp').is_file() and Path('/opt/tt-metal/models/common/modules/moe/kernels/routing_math.hpp').is_file()"

card:
  attribution: >-
    Derived from Qwen/Qwen3.6-35B-A3B (Qwen team, Alibaba Cloud, Apache-2.0): routed and shared experts quantized to
    GPTQ BFP4 and dense projections / LM head to BFP8 for Tenstorrent Blackhole.  A community package by Lottolabs;
    not an official Qwen or Tenstorrent release.
  description: >-
    Qwen3.6-35B-A3B, a 35B-parameter (3B active) hybrid MoE language model — 40 layers of Gated DeltaNet linear
    attention and gated full attention, 256-expert MoE with a shared expert, native 262,144-token context, one MTP
    head — served text-only through vLLM's OpenAI API by a custom tt-metal runtime with traced decode, fused decode
    kernels, MTP-1 speculative decoding, exact on-device sampling and exact prefix caching (one sequence; the
    release's 2–16-user batched mode is the separate package
    [Lottolabs/Qwen3.6-35B-A3B-TT-Mixed-BFP4-BFP8-P150-batched-tt-model](https://huggingface.co/Lottolabs/Qwen3.6-35B-A3B-TT-Mixed-BFP4-BFP8-P150-batched-tt-model)).
    The weights are the release
    [Lottolabs/Qwen3.6-35B-A3B-TT-Mixed-BFP4-BFP8-P150](https://huggingface.co/Lottolabs/Qwen3.6-35B-A3B-TT-Mixed-BFP4-BFP8-P150)
    (release x6-fused-20261007, commit c355c41d); the source is
    [LottoLottoLotto/tt-model-bundles](https://github.com/LottoLottoLotto/tt-model-bundles) (manifest),
    [tt-metal lottolabs/qwen3.6-35b-a3b-p150](https://github.com/LottoLottoLotto/tt-metal/tree/lottolabs/qwen3.6-35b-a3b-p150),
    [vllm lottolabs/qwen3.6-35b-a3b-p150](https://github.com/LottoLottoLotto/vllm/tree/lottolabs/qwen3.6-35b-a3b-p150) and
    [tt-model-plugins lottolabs/qwen3.6-35b-a3b-p150](https://github.com/LottoLottoLotto/tt-model-plugins/tree/lottolabs/qwen3.6-35b-a3b-p150).
  intended_use: >-
    Single-user text chat, reasoning, tool calling and long-context work (up to 262,144 tokens) on one Tenstorrent
    P150.
  prerequisites: |
    - About 22 GB in the Hugging Face cache for `checkpoint/`, plus about 25 GB for the converted-weight and kernel
      caches written on the first start (the first start takes about 15 minutes; later starts reuse them).
    - 64 GB of host RAM or more recommended (the model load peaks around 50 GB).
  usage: |
    Model name `Qwen/Qwen3.6-35B-A3B`.  Images and video are rejected.  Reasoning is returned in `reasoning`
    (Qwen3 reasoning parser); tools use the `qwen3_coder` parser; disable thinking per request with
    `"chat_template_kwargs": {"enable_thinking": false}`.  Default sampling is the checkpoint's generation_config.
    Temperature, top-k, top-p, min-p and the presence / frequency / repetition penalties sample on the device with
    vLLM's semantics; sampled requests keep MTP-1 through lossless speculative sampling.  Pick a profile rather than
    overriding `--max-model-len`.
  performance: |
    Quality, teacher-forced on the P150 against a CPU BF16 run of the original checkpoint (58,509 scored tokens):

    | corpus | PPL BF16 → TT | ΔPPL | top-1 agreement | mean KL |
    | --- | --- | --- | --- | --- |
    | chat | 2.641 → 2.663 | +0.82% | 0.935 | 0.023 |
    | code | 1.881 → 1.973 | +4.88% | 0.932 | 0.099 |
    | all | 2.481 → 2.599 | +4.78% | 0.918 | 0.075 |

    GSM8K (first 100, thinking off, greedy): 87/100 (CPU BF16 original: 90/100).

    | profile | ISL | OSL | concurrency | N | TTFT (ms) | prefill tok/s/u | decode tok/s/u | E2EL (s) |
    | --- | --- | --- | --- | --- | --- | --- | --- | --- |
    | single | 128 | 512 | 1 | 3 | 230 | 557 | 138.8 | — |
    | single | 2,048 | 512 | 1 | 3 | 980 | 2,090 | 137.5 | — |
    | single | 32,768 | 512 | 1 | 3 | 16,240 | 2,018 | 117.8 | — |
    | single | 261,632 | 512 | 1 | 3 | 169,630 | 1,542 | 58.8 | — |

    Release measurements (release README): decode tok/s/u is the median client-observed decode rate of greedy
    streamed requests on the release image single-x6 (`tools/probes/sample_bench.py`); TTFT is the cold (full
    prefill) TTFT measured on the release's earlier runtime, which the release states is unchanged; prefill tok/s/u
    = ISL / TTFT.  With prefix caching a repeated 65K / 262K prompt resumes in 1.3 / 2.3 s.  This package runs the
    same runtime: a greedy request served by it returns the same token ids as the release image.
  limitations: |
    - Text only; image and video inputs are rejected (the vision encoder is not shipped).
    - One sequence at a time; the release's batched (2–16 users) mode is a separate package.  One P150 only.
    - MTP-1 rejects `min_p` > 0, `logit_bias` and `min_tokens` > 1 (HTTP 400); use the `single-no-mtp` profile.
      `logprobs`, `logit_bias`, `allowed_token_ids`, `bad_words`, guided decoding and `top_k` disabled or above 64
      use the slower host sampler (about 31 tok/s).
    - Near 262K tokens retrieval works (passkeys pass) but the teacher-forced answer log-probability is low.
    - Quality is measured, not certified: the gap to BF16 is larger on code and long prose than on chat.
    - Tested on P150 firmware 19.15.0 with tt-kmd 2.11.0.  The tt-cli golden set (firmware 19.17.1) is untested.
    - Built on tenstorrent/tt-metal de59f8a (v0.76.0 + 1) with modified ttnn C++ (matmul, sparse_matmul,
      chunk_gated_delta_rule, gated_delta_attn), not on the tt-metal of the current golden set.
    - The weights paths are pinned under `HF_HOME` (`/hf/hub/...` in the container): keep `HF_HUB_CACHE` at its
      default (`$HF_HOME/hub`).
  licensing: >-
    Weights: Apache-2.0, derived from Qwen/Qwen3.6-35B-A3B (Apache-2.0); see the release repo's LICENSE.  The
    TTNN runtime and serving code in `code/`, the vLLM fork and the plugin are Apache-2.0.
  license:
    id: apache-2.0
  pipeline_tag: text-generation
  base_model: [Qwen/Qwen3.6-35B-A3B]
