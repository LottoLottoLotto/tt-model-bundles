# tt-model (v5.1 container) manifest: Qwen3.8-27B on one Tenstorrent P150.
# Release: https://huggingface.co/Lottolabs/Qwen3.8-27B-TT-Mixed-BFP4-BFP8-P150 (s27v8-20261112, main commit
# dd18ba3d), runtime image lottolabs/qwen27b-tt-p150:ctx5-s27v8 (8K and 128K profiles).  Build from this directory:
#   ../scripts/build_vllm_wheel.sh lottolabs/qwen3.8-27b-p150 wheels
#   tt-model package --container tt-model.yaml --out build
#   tt-model push build/qwen3.8-27b-tt-p150
# Profiles mirror the release's launch.py modes: each profile's env and vLLM arguments are what the release's
# serve_native.py passes to the ctx5-s27v8 image for that launch.py invocation (paths moved into the HF cache).
# The release's 262K profile runs on its other image (ctx6-kv4-s27v8, a different runtime tree) and is not offered.
schema: "5.1"

repo: Lottolabs/Qwen3.8-27B-TT-Mixed-BFP4-BFP8-P150-tt-model
name: qwen3.8-27b-tt-p150

# The release repo at the commit its main branch names.  checkpoint/ is the TT-native checkpoint (with config,
# tokenizer, processor, generation config and the reload proofs of the ctx5-s27v8 runtime), dflash-draft/ the bundled
# z-lab/Qwen3.8-27B-DFlash2 drafter, vision/ the vision tower.  runtime-image.tar.gz, runtime/, evidence/ and
# proofs-262k/ are not fetched.
weights:
  repo: Lottolabs/Qwen3.8-27B-TT-Mixed-BFP4-BFP8-P150
  revision: dd18ba3d25e5df0992ea52f3efcbf7d7a73b5d9b
  allow_patterns:
    - "checkpoint/*"
    - "dflash-draft/*"
    - "vision/*"

kind: vllm-plugin
arch: blackhole

image:
  registry: hf

source:
  # public tenstorrent/tt-metal de59f8a (the release image's base) + the release runtime tree: the qwen36 model
  # package (Python + JIT kernels), gated DeltaNet ops, and compiled C++ (ttnn matmul program factories,
  # chunk_gated_delta_rule / gated_delta_attn, tt_metal global_circular_buffer) that tt-model builds from this tree.
  tt_metal:
    repo: https://github.com/LottoLottoLotto/tt-metal
    ref: lottolabs/qwen3.8-27b-p150
  code:
    - models/demos/blackhole/qwen36                  # runtime, vLLM adapter, vision tower, JIT kernels
    - models/demos/blackhole/qwen38_27b_bundle       # vLLM model redirect (weights repo id -> checkpoint/)
    - models/experimental/gated_attention_gated_deltanet
    - models/common
    - models/tt_transformers
    - models/tt_dit                                  # utils.tensor
    - models/demos/qwen3_vl                          # vision helpers
    - models/demos/utils
    - models/demos/deepseek_v3_b1/unified_kernel_descriptor.py
    - models/demos/deepseek_v3_b1/unified_kernels    # kernel_op_api.hpp (#included by qwen36 kernels)
    - models/demos/deepseek_v3_b1/kernel_includes
    - native_checkpoint.py                           # native checkpoint loader + reload-proof check
    - qwen-runtime-support.json                      # runtime source identity the reload proofs bind
    - qwen-runtime-relocation.json                   # maps that identity to this install (QWEN36_RUNTIME_RELOCATION)
  ubuntu: "22.04"
  python: "3.10"            # the validated interpreter (the release image's python_env is 3.10)

runtime:
  # tenstorrent/vllm 03fa3af + the Qwen3.6/3.8 P150 core overlays (speculative config, stop strings under
  # speculation) + requirements pinned to the validated set (LottoLottoLotto/vllm lottolabs/qwen3.8-27b-p150),
  # built by ../scripts/build_vllm_wheel.sh.
  vllm: {wheel: wheels/vllm-*.whl}
  plugin:
    repo: https://github.com/LottoLottoLotto/tt-model-plugins
    ref: lottolabs/qwen3.8-27b-p150

serve:
  hardware: p150
  mesh_device: P150
  block_size: 64
  capabilities:
    tool_parser: qwen3_coder
    reasoning_parser: qwen3
  additional_config:
    tt:
      trace_mode: all
      enable_model_warmup: true
      l1_small_size: 24576
      sample_on_device_mode: decode_only
  env:
    # The reload proof's execution environment (checkpoint/equivalence*.json "runtime_environment"; the runtime
    # refuses to load the checkpoint under any other), the vision tower settings, and the weights paths in the
    # mounted HF cache (/hf = HF_HOME).  Pinning the paths also makes `tt-model serve` refuse to boot over an
    # incomplete cache.
    ARCH_NAME: "blackhole"
    HF_HUB_OFFLINE: "1"
    HF_MODEL: "/hf/hub/models--Lottolabs--Qwen3.8-27B-TT-Mixed-BFP4-BFP8-P150/snapshots/dd18ba3d25e5df0992ea52f3efcbf7d7a73b5d9b/checkpoint"
    MESH_DEVICE: "P150"
    MODEL_WEIGHTS_DIR: "/hf/hub/models--Lottolabs--Qwen3.8-27B-TT-Mixed-BFP4-BFP8-P150/snapshots/dd18ba3d25e5df0992ea52f3efcbf7d7a73b5d9b/checkpoint"
    QWEN36_BFP4_LM_HEAD: "1"
    QWEN36_BFP4_MLP_DOWN: "1"
    QWEN36_BFP4_WEIGHTS: "1"
    QWEN36_EVAL_PRECISION: "{\"layers\":{\"0\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"1\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"10\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"11\":{\"attention\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"12\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"13\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"14\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"15\":{\"attention\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"16\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"17\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"18\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"19\":{\"attention\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"2\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"20\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"21\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"22\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"23\":{\"attention\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"24\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"25\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"26\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"27\":{\"attention\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"28\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"29\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"3\":{\"attention\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"30\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"31\":{\"attention\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"32\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"33\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"34\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"35\":{\"attention\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"36\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"37\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"38\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"39\":{\"attention\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"4\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"40\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"41\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"42\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"43\":{\"attention\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"44\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"45\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"46\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"47\":{\"attention\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"48\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"49\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"5\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"50\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"51\":{\"attention\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"52\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"53\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"54\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"55\":{\"attention\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"56\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"57\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"58\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"59\":{\"attention\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"6\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"60\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"61\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"62\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"63\":{\"attention\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"7\":{\"attention\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"8\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"},\"9\":{\"gdn\":\"bfp8\",\"gdn_output\":\"bfp8\",\"mlp_down\":\"bfp4\",\"mlp_gate_up\":\"bfp4\"}},\"lm_head\":\"bfp8\"}"
    QWEN36_FUSED_FINAL_RESIDUAL_NORM: "1"
    QWEN36_FUSED_GATE_UP: "1"
    QWEN36_FUSED_GATE_UP_CORES: "109"
    QWEN36_FUSED_GATE_UP_PACKED: "1"
    QWEN36_FUSED_QKV: "1"
    QWEN36_GATEUP_CB_SLOTS: "2"
    QWEN36_GATEUP_OUTSTANDING: "1"
    QWEN36_GATEUP_REQUIRE_PACKED: "1"
