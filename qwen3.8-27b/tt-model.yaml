  - "import ttnn; assert hasattr(ttnn.transformer, 'verify_two_gated_delta_rule') and hasattr(ttnn.transformer, 'chunk_gated_delta_rule'), 'ttnn was not built from the release tree (GDN ops missing)'"
  - "import json, native_checkpoint as n; from pathlib import Path; r = json.load(open('/opt/tt-metal/qwen-runtime-relocation.json')); s = json.load(open('/opt/tt-metal/qwen-runtime-support.json')); bad = [k for k, v in s.items() if n.relocated_digest(k, v, r) is not None and n.digest(n.relocated_path(k, r, Path('/opt/tt-metal'))) != n.relocated_digest(k, v, r)]; assert not bad, bad; print(len(s), 'runtime sources match the release digests')"
  - "import json; r = json.load(open('/opt/tt-metal/models/demos/blackhole/qwen38_27b_bundle/vllm-model-redirect.json')); assert r['Lottolabs/Qwen3.8-27B-TT-Mixed-BFP4-BFP8-P150'].endswith('dd18ba3d25e5df0992ea52f3efcbf7d7a73b5d9b/checkpoint')"
  - "import vllm_tt_plugin.prefix_resume, vllm.config.speculative as s, inspect; assert 'dflash' in inspect.getsource(s)"
  - "import torchvision, cv2; assert torchvision.__version__.split('+')[0] == '0.26.0', torchvision.__version__"
  - "from models.demos.blackhole.qwen36.tt import qwen36_vllm, model; import models.demos.blackhole.qwen36.tt.vision"

card:
  attribution: >-
    Derived from Qwen/Qwen3.8-27B (Qwen team, Apache-2.0; revision 1d4bf0f2): MLP matrices GPTQ-quantized to BFP4 and
    the rest of the linear layers in BFP8 for Tenstorrent Blackhole, as published in the Lottolabs release.  The
    bundled DFlash2 drafter is z-lab/Qwen3.8-27B-DFlash2 (Apache-2.0, byte-identical).  A community package by
    Lottolabs; not an official Qwen, z-lab or Tenstorrent release.
  description: >-
    Qwen3.8-27B, a 27B-parameter hybrid Gated DeltaNet / gated-attention model with image and video input, served
    through vLLM's OpenAI API by a custom tt-metal runtime on one P150: traced decode with fused GDN kernels, DFlash2
    block-8 speculative decoding with the bundled drafter (or MTP), on-device exact sampling, exact prefix caching,
    up to 16 users per decode step (4 or 8 with DFlash2 shared verify rounds) and a BFP8 vision tower.  The weights
    are the release
    [Lottolabs/Qwen3.8-27B-TT-Mixed-BFP4-BFP8-P150](https://huggingface.co/Lottolabs/Qwen3.8-27B-TT-Mixed-BFP4-BFP8-P150)
    (s27v8-20261112, commit dd18ba3d); the source is
    [LottoLottoLotto/tt-model-bundles](https://github.com/LottoLottoLotto/tt-model-bundles) (manifest),
    [tt-metal lottolabs/qwen3.8-27b-p150](https://github.com/LottoLottoLotto/tt-metal/tree/lottolabs/qwen3.8-27b-p150),
    [vllm lottolabs/qwen3.8-27b-p150](https://github.com/LottoLottoLotto/vllm/tree/lottolabs/qwen3.8-27b-p150) and
    [tt-model-plugins lottolabs/qwen3.8-27b-p150](https://github.com/LottoLottoLotto/tt-model-plugins/tree/lottolabs/qwen3.8-27b-p150).
    This package carries the runtime of the release's 8K and 128K profiles (image lottolabs/qwen27b-tt-p150:ctx5-s27v8).
  intended_use: >-
    Chat, reasoning, coding, tool calling and image / video understanding on one Tenstorrent P150, for one user at
    up to 131,072 tokens of context or up to 16 concurrent users.
  prerequisites: |
    - About 27 GB in the Hugging Face cache for `checkpoint/`, `dflash-draft/` and `vision/`, plus about 23 GB of
      converted-tensor cache per decoding mode (DFlash2, MTP, non-speculative) written on the first start of that
      mode (several minutes; later starts reuse it), plus the JIT kernel cache.
  usage: |
    Model name `Qwen/Qwen3.8-27B`.  The default profile `8k` is the release's default launch (one user, 8,192 tokens,
    DFlash2).  Pick another profile with `--profile` (`128k`, `8k-users4`, `8k-users16`, `8k-off`, ...) rather than
    overriding `--max-model-len` or `--max-num-seqs`: each profile carries the memory plan and the reload-proof
    environment of its launch.py mode, and the runtime refuses an environment its proofs do not cover.  Reasoning is
    returned in `reasoning_content` (`"chat_template_kwargs": {"enable_thinking": false}` turns it off); tool calls
    use the qwen3_coder format.  Images and videos go into chat messages as in the OpenAI API, any number per
    request (data URLs or links the container can fetch); on the 8K profiles one image is resized to at most
    8,388,608 pixels so it fits the context.
  performance: |
    Release-measured on its ctx5-s27v8 image (this package runs the same runtime tree; its greedy tokens equal the
    release image's, see the verification in the source repository).  Single user: 512 streamed output tokens, chat
    prompts, greedy, p50 of 3 requests (release README "Speed"; TTFT from its cold-prompt figures).  Multi-user:
    greedy requests of 256 tokens all starting together, median of 3 runs, per-user decode tok/s including prefill
    (release README, s27v7/s27v8 HTTP benches; greedy is unchanged in s27v8).

    | profile | ISL | OSL | concurrency | N | TTFT (ms) | prefill tok/s/u | decode tok/s/u | E2EL (s) |
    | --- | --- | --- | --- | --- | --- | --- | --- | --- |
    | 8k (DFlash2) | 128 | 512 | 1 | 3 | ~200 | — | 50.1 | — |
    | 8k (DFlash2) | 2,048 | 512 | 1 | 3 | ~1,700 | ~1,200 | 54.5 | — |
    | 128k (DFlash2) | 128 | 512 | 1 | 3 | — | — | 49.0 | — |
    | 128k (DFlash2) | 2,048 | 512 | 1 | 3 | — | — | 49.8 | — |
    | 128k (DFlash2) | 32,768 | 512 | 1 | 3 | ~31,000 | ~1,060 | 47.2 | — |
    | 8k-off | 128 / 2,048 | 512 | 1 | 3 | — | — | 20.2 / 20.0 | — |
    | 8k-users4 (chat) | chat | 256 | 4 | 3 | — | — | 25.7 | — |
    | 8k-users8 (chat) | chat | 256 | 8 | 3 | — | — | 16.3 | — |
    | 8k-users16 (chat) | chat | 256 | 16 | 3 | — | — | 12.6 | — |
    Quality of the checkpoint (teacher-forced on the P150, 34 records, 42,129 scored positions; release README):
    KL / top-1 against the TT all-BFP8 build 0.055 / 0.925 overall; against a CPU BF16 reference, code +4.25% Δppl /
    0.931 top-1, instruct −0.09% / 0.960.  Greedy speculative output (DFlash2, MTP) is token-identical to
    non-speculative output of the same profile.
  limitations: |
    - One P150.  Up to 16 users per decode step; speculation with one user, or with 4 or 8 users on the 8K profiles.
    - The release's native 262,144-token profile is not in this package: it runs on the release's other image
      (ctx6-kv4-s27v8, whose runtime adds the 4-bit V cache), and one package carries one runtime tree.  Use the
      release's launch.py for 262K.  This package serves up to 131,072 tokens.
    - Tested on P150 firmware 19.15.0 with tt-kmd 2.11.0.  The tt-cli golden set (firmware 19.17.1) is untested.
    - Built on tenstorrent/tt-metal de59f8a (v0.76.0 + 1), not on the tt-metal of the current golden set.
    - The runtime checks the checkpoint's reload proofs, which bind the release image's source and library digests:
      this package's sources match them byte for byte except two files changed by path/licence cleanups, and its TTNN
      libraries are compiled from the same sources (listed in `qwen-runtime-relocation.json`).
    - With speculation on, `min_p`, `logit_bias` and `min_tokens` are rejected with HTTP 400 (upstream vLLM); use the
      `8k-off` / `128k-off` profiles for them.  Logprobs, grammars and other host-sampler features run one token
      per step on the host sampler.
    - Prefix caching resumes only at 2,048-token chunk boundaries.  Cold long prompts have a long time to first
      token (about 3 min at 128K).
    - Image and video input is always on; there is no text-only profile (the release's `--vision off`).
    - The weights paths are pinned under `HF_HOME` (`/hf/hub/...` in the container): keep `HF_HUB_CACHE` at its
      default (`$HF_HOME/hub`).
  licensing: >-
    Weights: Apache-2.0 (Qwen/Qwen3.8-27B; see the release repo's LICENSE), the DFlash2 drafter Apache-2.0
    (z-lab/Qwen3.8-27B-DFlash2).  The TTNN runtime and serving code in `code/`, the vLLM fork and the plugin are
    Apache-2.0.
  license:
    id: apache-2.0
  pipeline_tag: image-text-to-text
  base_model: [Qwen/Qwen3.8-27B]
