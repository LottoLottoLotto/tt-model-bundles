    VLLM_TARGET_DEVICE: "tt"
  # One FLAT list (anchored): each profile's `args: [*common_args, ...]` nests it one level, which tt-model flattens.
  # vLLM is handed the repo id (positional, from `weights`); VLLM_MODEL_REDIRECT_PATH maps it to checkpoint/.
  args: &common_args
    - --served-model-name
    - Qwen/Qwen3.8-27B
    - --seed
    - "9472"

serve_profiles:
  - name: 8k
    description: >-
      The release default (launch.py with no options): one user, 8,192-token context, BF16 KV, DFlash2 block-8 speculative decoding with the bundled drafter, images and videos, exact prefix caching.
    max_model_len: 8192
    max_num_seqs: 1
    additional_config: {tt: {trace_region_size: 1073741824}}
    env:
      QWEN36_DFLASH: "1"
      QWEN36_DFLASH_BLOCK_SIZE: "8"
      QWEN36_DFLASH_MODEL: "/hf/hub/models--Lottolabs--Qwen3.8-27B-TT-Mixed-BFP4-BFP8-P150/snapshots/dd18ba3d25e5df0992ea52f3efcbf7d7a73b5d9b/dflash-draft"
      QWEN36_MAX_TOKENS_ALL_USERS: "8192"
      QWEN36_MTP: "0"
      QWEN36_MTP_DEPTH: "1"
      TT_CACHE_PATH: "/tensor-cache/dflash"
    args:
      - *common_args
      - ["--max-num-batched-tokens", "16384"]
      - "--enable-prefix-caching"
      - ["--mm-processor-kwargs", "{\"max_pixels\": 8388608, \"size\": {\"shortest_edge\": 65536, \"longest_edge\": 8388608}}"]
      - "--no-enable-chunked-prefill"
      - ["--speculative-config", "{\"method\": \"dflash\", \"model\": \"/hf/hub/models--Lottolabs--Qwen3.8-27B-TT-Mixed-BFP4-BFP8-P150/snapshots/dd18ba3d25e5df0992ea52f3efcbf7d7a73b5d9b/dflash-draft\", \"num_speculative_tokens\": 7}"]
  - name: 8k-mtp
    description: >-
      One user, 8,192 tokens, MTP-1 speculation instead of DFlash2 (launch.py --spec mtp).
    max_model_len: 8192
    max_num_seqs: 1
    additional_config: {tt: {trace_region_size: 1073741824}}
    env:
      QWEN36_DFLASH: "0"
      QWEN36_MAX_TOKENS_ALL_USERS: "8192"
      QWEN36_MTP: "1"
      QWEN36_MTP_DEPTH: "1"
      TT_CACHE_PATH: "/tensor-cache/mtp1"
    args:
      - *common_args
      - ["--max-num-batched-tokens", "16384"]
      - "--enable-prefix-caching"
      - ["--mm-processor-kwargs", "{\"max_pixels\": 8388608, \"size\": {\"shortest_edge\": 65536, \"longest_edge\": 8388608}}"]
      - ["--speculative-config", "{\"method\": \"mtp\", \"num_speculative_tokens\": 1}"]
  - name: 8k-off
    description: >-
      One user, 8,192 tokens, the verified non-speculative path (launch.py --spec off).
    max_model_len: 8192
    max_num_seqs: 1
    additional_config: {tt: {trace_region_size: 1073741824}}
    env:
      QWEN36_DFLASH: "0"
      QWEN36_MAX_TOKENS_ALL_USERS: "8192"
      QWEN36_MTP: "0"
      QWEN36_MTP_DEPTH: "1"
      TT_CACHE_PATH: "/tensor-cache/off"
    args:
      - *common_args
      - ["--max-num-batched-tokens", "16384"]
      - "--enable-prefix-caching"
      - ["--mm-processor-kwargs", "{\"max_pixels\": 8388608, \"size\": {\"shortest_edge\": 65536, \"longest_edge\": 8388608}}"]
  - name: 8k-noprefix
    description: >-
      The default profile with prefix caching off (launch.py --prefix-caching off).
    max_model_len: 8192
    max_num_seqs: 1
    additional_config: {tt: {trace_region_size: 1073741824}}
    env:
      QWEN36_DFLASH: "1"
      QWEN36_DFLASH_BLOCK_SIZE: "8"
      QWEN36_DFLASH_MODEL: "/hf/hub/models--Lottolabs--Qwen3.8-27B-TT-Mixed-BFP4-BFP8-P150/snapshots/dd18ba3d25e5df0992ea52f3efcbf7d7a73b5d9b/dflash-draft"
      QWEN36_MAX_TOKENS_ALL_USERS: "8192"
      QWEN36_MTP: "0"
      QWEN36_MTP_DEPTH: "1"
      TT_CACHE_PATH: "/tensor-cache/dflash"
    args:
      - *common_args
      - ["--max-num-batched-tokens", "16384"]
      - "--no-enable-prefix-caching"
      - ["--mm-processor-kwargs", "{\"max_pixels\": 8388608, \"size\": {\"shortest_edge\": 65536, \"longest_edge\": 8388608}}"]
      - "--no-enable-chunked-prefill"
      - ["--speculative-config", "{\"method\": \"dflash\", \"model\": \"/hf/hub/models--Lottolabs--Qwen3.8-27B-TT-Mixed-BFP4-BFP8-P150/snapshots/dd18ba3d25e5df0992ea52f3efcbf7d7a73b5d9b/dflash-draft\", \"num_speculative_tokens\": 7}"]
  - name: 8k-users4
    description: >-
      Up to 4 concurrent users, 8,192 tokens each, BF16 KV (32,768-token pool), DFlash2 shared verify rounds for greedy and device-sampled requests (launch.py --users 4).
    max_model_len: 8192
    max_num_seqs: 4
    additional_config: {tt: {trace_region_size: 1073741824}}
    env:
      QWEN36_DFLASH: "1"
      QWEN36_DFLASH_BLOCK_SIZE: "8"
      QWEN36_DFLASH_MODEL: "/hf/hub/models--Lottolabs--Qwen3.8-27B-TT-Mixed-BFP4-BFP8-P150/snapshots/dd18ba3d25e5df0992ea52f3efcbf7d7a73b5d9b/dflash-draft"
      QWEN36_MAX_TOKENS_ALL_USERS: "32768"
      QWEN36_MTP: "0"
      QWEN36_MTP_DEPTH: "1"
      TT_CACHE_PATH: "/tensor-cache/dflash"
    args:
      - *common_args
      - ["--max-num-batched-tokens", "16384"]
      - "--enable-prefix-caching"
      - ["--mm-processor-kwargs", "{\"max_pixels\": 8388608, \"size\": {\"shortest_edge\": 65536, \"longest_edge\": 8388608}}"]
      - ["--speculative-config", "{\"method\": \"dflash\", \"model\": \"/hf/hub/models--Lottolabs--Qwen3.8-27B-TT-Mixed-BFP4-BFP8-P150/snapshots/dd18ba3d25e5df0992ea52f3efcbf7d7a73b5d9b/dflash-draft\", \"num_speculative_tokens\": 7}"]
  - name: 8k-users8
    description: >-
      Up to 8 concurrent users, 8,192 tokens each, BFP8 KV (65,536-token pool), DFlash2 shared verify rounds (launch.py --users 8).
    max_model_len: 8192
    max_num_seqs: 8
    additional_config: {tt: {trace_region_size: 1073741824}}
    env:
